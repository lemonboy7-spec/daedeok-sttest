name: 음성시험 APK 만들기
on:
  push:
    branches: [main]
    paths: ["sttest/**", ".github/workflows/sttest.yml"]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: SDK 라이선스 동의
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: APK 빌드
        run: |
          F=$(grep -rl --include=settings.gradle.kts DaedeokSttTest . | head -1)
          if [ -z "$F" ]; then echo "sttest 폴더가 저장소에 없습니다. 올라간 파일:"; find . -not -path "./.git/*" | head -60; exit 1; fi
          cd "$(dirname "$F")" && gradle assembleRelease --no-daemon --stacktrace
      - name: APK 모으기
        run: |
          mkdir -p apk-out
          find . -path "*/sttest/*" -name "*.apk" -not -path "./apk-out/*" -exec cp {} apk-out/daedeok-sttest-0.1.apk \;
          ls -la apk-out; test -s apk-out/daedeok-sttest-0.1.apk
      - uses: actions/upload-artifact@v4
        with: { name: daedeok-sttest-apk, path: apk-out/, if-no-files-found: error }
